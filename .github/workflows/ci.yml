name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  patcher:
    # patcher/ only depends on Mono.Cecil (it manipulates the game's DLL at
    # runtime, it doesn't reference it to compile) so this builds standalone.
    # mod/ is NOT built here: it compiles against the player's own
    # Assembly-CSharp.dll and UnityEngine module DLLs, which we never ship
    # and CI has no access to - see install.sh, which builds it locally
    # against the player's own game files at install time instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build patcher

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r server/requirements.txt
      - name: Import every server module
        working-directory: server
        run: python -c "import appearance, boats, runlog, tiles, sailaway_server"

  install-script:
    # Only a syntax check: the real install (building mod/ against the
    # player's own game files, patching, launching Sailaway) can't run in
    # CI at all - see the patcher job's comment above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install.sh
